name: Update lunch menus

on:
  schedule:
    - cron: "0 11 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-menu:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the site
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Load the upcoming menu
        run: node scripts/update-lunch-menu.mjs

      - name: Publish changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lunch-menu.json
          git diff --cached --quiet || git commit -m "Update weekly lunch menus"
          git push
